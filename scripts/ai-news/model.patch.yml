# 定时任务专用的模型覆盖层（overlay patch）
#
# 作用：把「每日 AI 新闻」定时任务固定使用指定模型，而不改动 DSH App 的默认模型。
# 原理：dsh 的 --patch 可以叠加多次，且在 profile 层之后应用，所以这里写什么就覆盖什么。
#       provider 定义仍来自 desktop profile 的 cordis.patch.yml（Key、baseURL 自动跟随），
#       这里覆盖 agent-default-model，并恢复 headless 默认禁用的托管凭据条目。
#
# 如何换模型：把下面的 model 改成想用的 id 即可（保存即生效，无需重载 launchd）。
#   当前 opay-gateway 路由可用的模型 id 见：
#   ~/.dsh/profiles/desktop/cordis.patch.yml 的 llm-pi-ai 段，例如：
#     deepseek-flash / deepseek-v4-pro / deepseek-v4.1-flash / on-premise/deepseek-v4.1-flash
#     glm-5.3 / glm-5.3-flash / on-premise/glm-5.3-flash
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opay-gateway
    model: deepseek-flash

- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false
